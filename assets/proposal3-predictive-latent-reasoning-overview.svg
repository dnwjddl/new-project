<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Predictive Latent Reasoning for Streaming Video Representation</title>
  <desc id="desc">A causal video encoder builds a bounded belief state. A shared recurrent latent core predicts a future latent, compares it to the next observation, and adaptively allocates belief correction and memory updates.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#26333d"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#3f6f9f"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0 0L9 4.5L0 9Z" fill="#d9573f"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17212b" flood-opacity="0.10"/>
    </filter>
    <symbol id="cup-empty" viewBox="0 0 100 100">
      <rect x="0" y="72" width="100" height="28" fill="#d7c4a7"/>
      <path d="M31 36H68L64 76H36Z" fill="#fff" stroke="#4e5a61" stroke-width="3"/>
      <path d="M67 44C83 40 84 68 65 65" fill="none" stroke="#4e5a61" stroke-width="3"/>
    </symbol>
    <symbol id="cup-fill" viewBox="0 0 100 100">
      <rect x="0" y="72" width="100" height="28" fill="#d7c4a7"/>
      <path d="M31 36H68L64 76H36Z" fill="#fff" stroke="#4e5a61" stroke-width="3"/>
      <path d="M34 54H66L64 76H36Z" fill="#6fb3cf"/>
      <path d="M67 44C83 40 84 68 65 65" fill="none" stroke="#4e5a61" stroke-width="3"/>
    </symbol>
    <symbol id="cup-pour" viewBox="0 0 100 100">
      <rect x="0" y="72" width="100" height="28" fill="#d7c4a7"/>
      <path d="M35 38H70L66 77H40Z" fill="#fff" stroke="#4e5a61" stroke-width="3"/>
      <path d="M69 45C83 42 85 67 67 65" fill="none" stroke="#4e5a61" stroke-width="3"/>
      <g transform="rotate(28 34 20)">
        <rect x="8" y="9" width="42" height="20" rx="5" fill="#9ec2ce" stroke="#3f6f9f" stroke-width="2"/>
        <rect x="47" y="15" width="16" height="8" rx="2" fill="#9ec2ce" stroke="#3f6f9f" stroke-width="2"/>
      </g>
      <path d="M47 31C49 40 47 48 46 56" fill="none" stroke="#3f91b6" stroke-width="4" stroke-linecap="round"/>
    </symbol>
    <symbol id="cup-spill" viewBox="0 0 100 100">
      <rect x="0" y="72" width="100" height="28" fill="#d7c4a7"/>
      <g transform="rotate(49 55 60)">
        <path d="M35 36H72L68 76H40Z" fill="#fff" stroke="#4e5a61" stroke-width="3"/>
        <path d="M71 44C87 40 88 68 69 65" fill="none" stroke="#4e5a61" stroke-width="3"/>
      </g>
      <path d="M14 78C21 61 38 63 50 76C38 84 26 87 11 83Z" fill="#6fb3cf"/>
    </symbol>
    <style>
      text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #17212b; letter-spacing: 0; }
      .title { font-size: 36px; font-weight: 750; }
      .subtitle { font-size: 18px; fill: #5b6873; }
      .panel-title { font-size: 22px; font-weight: 750; }
      .panel-copy { font-size: 16px; fill: #52606b; }
      .node-title { font-size: 17px; font-weight: 750; }
      .node-copy { font-size: 14px; fill: #52606b; }
      .small { font-size: 13px; fill: #66737d; }
      .math { font-size: 19px; font-weight: 700; }
      .white { fill: #fff; }
      .blue { fill: #3f6f9f; }
      .teal { fill: #167d77; }
      .red { fill: #d9573f; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="54" y="56" class="title">Predictive Latent Reasoning for Streaming Video Representation</text>
  <text x="54" y="86" class="subtitle">A predict-observe-correct encoder with bounded memory and adaptive recurrent compute</text>

  <!-- Four conceptual panels -->
  <rect x="42" y="120" width="318" height="620" rx="8" fill="#f7f9fa" stroke="#dce2e6" stroke-width="2"/>
  <rect x="378" y="120" width="366" height="620" rx="8" fill="#f4f8fb" stroke="#d6e3ed" stroke-width="2"/>
  <rect x="762" y="120" width="420" height="620" rx="8" fill="#fff8f5" stroke="#efdbd4" stroke-width="2"/>
  <rect x="1200" y="120" width="358" height="620" rx="8" fill="#f5faf8" stroke="#d5e8e3" stroke-width="2"/>

  <!-- (a) Causal encoder -->
  <rect x="62" y="140" width="36" height="28" rx="4" fill="#17212b"/>
  <text x="80" y="160" text-anchor="middle" class="node-title white">a</text>
  <text x="112" y="160" class="panel-title">Causal observation</text>
  <text x="62" y="187" class="panel-copy">Read each new video chunk once.</text>

  <g filter="url(#shadow)">
    <rect x="62" y="224" width="82" height="126" rx="6" fill="#edf1ee" stroke="#cdd6d1"/>
    <rect x="151" y="224" width="82" height="126" rx="6" fill="#edf1ee" stroke="#cdd6d1"/>
    <rect x="240" y="224" width="82" height="126" rx="6" fill="#edf1ee" stroke="#cdd6d1"/>
  </g>
  <use href="#cup-empty" x="62" y="244" width="82" height="82"/>
  <use href="#cup-pour" x="151" y="244" width="82" height="82"/>
  <use href="#cup-fill" x="240" y="244" width="82" height="82"/>
  <text x="103" y="372" text-anchor="middle" class="small">t−2</text>
  <text x="192" y="372" text-anchor="middle" class="small">t−1</text>
  <text x="281" y="372" text-anchor="middle" class="small">t</text>

  <path d="M192 390V420" stroke="#26333d" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="91" y="431" width="202" height="68" rx="7" fill="#fff" stroke="#aeb9c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="192" y="459" text-anchor="middle" class="node-title">Video encoder E</text>
  <text x="192" y="482" text-anchor="middle" class="node-copy">pretrained · strictly causal</text>
  <path d="M192 499V530" stroke="#26333d" stroke-width="2.5" marker-end="url(#arrow)"/>

  <text x="192" y="555" text-anchor="middle" class="small">BOUNDED BELIEF STATE</text>
  <rect x="77" y="570" width="230" height="72" rx="7" fill="#e9f6f4" stroke="#60a9a3" stroke-width="2" filter="url(#shadow)"/>
  <g fill="#167d77">
    <rect x="98" y="589" width="25" height="34" rx="4"/>
    <rect x="132" y="589" width="25" height="34" rx="4" opacity="0.90"/>
    <rect x="166" y="589" width="25" height="34" rx="4" opacity="0.80"/>
    <rect x="200" y="589" width="25" height="34" rx="4" opacity="0.70"/>
    <rect x="234" y="589" width="25" height="34" rx="4" opacity="0.60"/>
    <rect x="268" y="589" width="25" height="34" rx="4" opacity="0.50"/>
  </g>
  <text x="192" y="680" text-anchor="middle" class="math teal">Mₜ ∈ ℝᴺˣᴰ</text>
  <text x="192" y="705" text-anchor="middle" class="small">constant size as the stream grows</text>

  <!-- A to B -->
  <path d="M360 606H400" stroke="#26333d" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- (b) Prospective reasoning -->
  <rect x="398" y="140" width="36" height="28" rx="4" fill="#3f6f9f"/>
  <text x="416" y="160" text-anchor="middle" class="node-title white">b</text>
  <text x="448" y="160" class="panel-title">Prospective latent reasoning</text>
  <text x="398" y="187" class="panel-copy">Imagine the future without new pixels.</text>

  <rect x="438" y="235" width="246" height="84" rx="8" fill="#fff" stroke="#7198b8" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="561" y="268" text-anchor="middle" class="node-title blue">Shared recurrent core Rθ</text>
  <text x="561" y="295" text-anchor="middle" class="node-copy">mode = predict</text>
  <path d="M657 237C713 205 713 325 661 307" fill="none" stroke="#3f6f9f" stroke-width="2.4" marker-end="url(#arrow-blue)"/>
  <text x="693" y="220" text-anchor="middle" class="small">shared weights</text>

  <path d="M561 319V357" stroke="#3f6f9f" stroke-width="2.7" marker-end="url(#arrow-blue)"/>
  <circle cx="442" cy="409" r="37" fill="#e9f6f4" stroke="#167d77" stroke-width="2.3"/>
  <circle cx="561" cy="409" r="43" fill="#3f6f9f" stroke="#315b84" stroke-width="2.7" filter="url(#shadow)"/>
  <circle cx="680" cy="409" r="37" fill="#fff" stroke="#7198b8" stroke-width="2.2" stroke-dasharray="7 6"/>
  <text x="442" y="404" text-anchor="middle" class="math teal">h⁰</text>
  <text x="442" y="427" text-anchor="middle" class="small">Mₜ</text>
  <text x="561" y="404" text-anchor="middle" class="math white">h¹</text>
  <text x="561" y="427" text-anchor="middle" class="small white">required</text>
  <text x="680" y="404" text-anchor="middle" class="math blue">h²…hᴴ</text>
  <text x="680" y="427" text-anchor="middle" class="small">optional</text>
  <path d="M480 409H515" stroke="#3f6f9f" stroke-width="2.7" marker-end="url(#arrow-blue)"/>
  <path d="M605 409H642" stroke="#3f6f9f" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrow-blue)"/>

  <rect x="422" y="494" width="278" height="93" rx="7" fill="#eaf2f8" stroke="#afc9dc" stroke-width="2"/>
  <text x="561" y="525" text-anchor="middle" class="small">DEFAULT: ONE-STEP PRIOR</text>
  <text x="561" y="554" text-anchor="middle" class="math blue">ẑₜ₊₁ = G(h¹)</text>
  <text x="561" y="575" text-anchor="middle" class="node-copy">next semantic latent</text>

  <rect x="422" y="610" width="278" height="79" rx="7" fill="#fff" stroke="#afc9dc" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="561" y="639" text-anchor="middle" class="node-title">Optional longer rollout</text>
  <text x="561" y="664" text-anchor="middle" class="node-copy">continue only when it improves anticipation</text>

  <!-- B to C -->
  <path d="M744 541H786" stroke="#3f6f9f" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- (c) Predict-observe comparison -->
  <rect x="782" y="140" width="36" height="28" rx="4" fill="#d9573f"/>
  <text x="800" y="160" text-anchor="middle" class="node-title white">c</text>
  <text x="832" y="160" class="panel-title">Observe and measure innovation</text>
  <text x="782" y="187" class="panel-copy">Use prediction error during streaming inference.</text>

  <text x="880" y="233" text-anchor="middle" class="small">PREDICTED</text>
  <rect x="805" y="250" width="150" height="143" rx="7" fill="#eaf2f8" stroke="#7198b8" stroke-width="2" filter="url(#shadow)"/>
  <use href="#cup-fill" x="830" y="262" width="100" height="100"/>
  <text x="880" y="420" text-anchor="middle" class="math blue">ẑₜ₊₁</text>
  <text x="880" y="442" text-anchor="middle" class="small">“cup becomes full”</text>

  <text x="1064" y="233" text-anchor="middle" class="small">OBSERVED</text>
  <rect x="989" y="250" width="150" height="143" rx="7" fill="#fff0eb" stroke="#e49583" stroke-width="2" filter="url(#shadow)"/>
  <use href="#cup-spill" x="1014" y="262" width="100" height="100"/>
  <text x="1064" y="420" text-anchor="middle" class="math red">zₜ₊₁ = E(xₜ₊₁)</text>
  <text x="1064" y="442" text-anchor="middle" class="small">“water is spilled”</text>

  <path d="M880 460L938 510" stroke="#3f6f9f" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <path d="M1064 460L1006 510" stroke="#d9573f" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <circle cx="972" cy="550" r="62" fill="#fff" stroke="#d9573f" stroke-width="3" filter="url(#shadow)"/>
  <text x="972" y="538" text-anchor="middle" class="node-title red">COMPARE</text>
  <text x="972" y="567" text-anchor="middle" class="math">Iₜ₊₁</text>
  <text x="972" y="588" text-anchor="middle" class="small">calibrated error</text>

  <path d="M972 612V636" stroke="#d9573f" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <rect x="817" y="647" width="310" height="62" rx="7" fill="#fff0eb" stroke="#e49583" stroke-width="2"/>
  <text x="972" y="673" text-anchor="middle" class="node-title red">Semantic innovation, not pixel residual</text>
  <text x="972" y="696" text-anchor="middle" class="node-copy">event change · relevance · uncertainty</text>

  <!-- C to D -->
  <path d="M1182 550H1224" stroke="#d9573f" stroke-width="3" marker-end="url(#arrow-red)"/>

  <!-- (d) Adaptive correction -->
  <rect x="1220" y="140" width="36" height="28" rx="4" fill="#167d77"/>
  <text x="1238" y="160" text-anchor="middle" class="node-title white">d</text>
  <text x="1270" y="160" class="panel-title">Adaptive belief correction</text>
  <text x="1220" y="187" class="panel-copy">Revise only as much as needed.</text>

  <polygon points="1379,247 1461,306 1379,365 1297,306" fill="#fff" stroke="#8e9ba4" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="1379" y="300" text-anchor="middle" class="node-title">Is innovation</text>
  <text x="1379" y="324" text-anchor="middle" class="node-title">important?</text>

  <path d="M1297 306H1247V410H1306" fill="none" stroke="#77858e" stroke-width="2.3" marker-end="url(#arrow)"/>
  <text x="1268" y="290" text-anchor="middle" class="small">LOW</text>
  <rect x="1306" y="380" width="216" height="62" rx="7" fill="#fff" stroke="#aeb9c0" stroke-width="2"/>
  <text x="1414" y="406" text-anchor="middle" class="node-title">Early exit</text>
  <text x="1414" y="429" text-anchor="middle" class="node-copy">reuse state · minimal update</text>

  <path d="M1461 306H1526V488H1508" fill="none" stroke="#d9573f" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="1494" y="290" text-anchor="middle" class="small red">HIGH</text>
  <rect x="1250" y="470" width="258" height="91" rx="8" fill="#fff0eb" stroke="#d9573f" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1379" y="500" text-anchor="middle" class="node-title red">Corrective latent reasoning</text>
  <text x="1379" y="529" text-anchor="middle" class="math">Rθ × K(I)</text>
  <text x="1379" y="550" text-anchor="middle" class="small">same weights · mode = correct</text>

  <path d="M1379 561V593" stroke="#167d77" stroke-width="2.8" marker-end="url(#arrow)"/>
  <rect x="1245" y="605" width="268" height="81" rx="7" fill="#e9f6f4" stroke="#60a9a3" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1379" y="634" text-anchor="middle" class="node-title teal">Updated posterior Mₜ₊₁</text>
  <g fill="#167d77">
    <rect x="1290" y="650" width="22" height="24" rx="4"/>
    <rect x="1322" y="650" width="22" height="24" rx="4" opacity="0.88"/>
    <rect x="1354" y="650" width="22" height="24" rx="4" opacity="0.78"/>
    <rect x="1386" y="650" width="22" height="24" rx="4" fill="#d9573f"/>
    <rect x="1418" y="650" width="22" height="24" rx="4" opacity="0.62"/>
    <rect x="1450" y="650" width="22" height="24" rx="4" opacity="0.50"/>
  </g>
  <text x="1379" y="715" text-anchor="middle" class="small">representation for anticipation and understanding</text>

  <!-- Novelty / training band -->
  <rect x="42" y="770" width="1516" height="92" rx="8" fill="#17212b"/>
  <text x="70" y="801" class="small white">TRAINING</text>
  <text x="70" y="826" class="node-copy white">future alignment + posterior gain</text>
  <text x="70" y="848" class="node-copy white">+ adaptive compute penalty</text>
  <line x1="388" y1="790" x2="388" y2="842" stroke="#4c5963" stroke-width="2"/>
  <text x="420" y="801" class="small white">CORE DISTINCTION</text>
  <text x="420" y="831" class="node-title white">Prediction error is not discarded after pretraining; it closes the streaming inference loop.</text>
  <text x="1558" y="886" text-anchor="end" class="small">Figure 1 · Default one-step prediction, optional rollout, and innovation-gated correction</text>
</svg>
